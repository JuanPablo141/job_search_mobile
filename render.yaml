services:
  - type: web
    name: jobsearch-api
    runtime: docker
    rootDir: API
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SYNC_TOKEN
        value: jobsearch-internal-sync-token-2026
      - key: PYTHON_CMD
        value: python3
